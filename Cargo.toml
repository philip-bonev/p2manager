[package]
name = "p2manager"
version = "1.0.12"
description = "Two Panel File Manager."
authors = ["Philip Bonev"]
license = "Apache 2.0"
repository = "https://github.com/philip-bonev/p2manager.git"
edition = "2024"

[lib]
name = "panel_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

