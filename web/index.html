<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Manager</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <header class="toolbar top">
      <button id="btn-back" data-i18n-title="title.back"><svg class="tb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span data-i18n="toolbar.back">Назад</span></button>
      <button id="btn-up" data-i18n-title="title.up"><svg class="tb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span data-i18n="toolbar.up">Нагоре</span></button>
      <button id="btn-home" data-i18n-title="title.home"><svg class="tb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg><span data-i18n="toolbar.home">Старт</span></button>
      <button id="btn-refresh" data-i18n-title="title.refresh"><svg class="tb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg><span data-i18n="toolbar.refresh">Обнови</span></button>
      <span class="sep"></span>
      <button id="btn-command" data-i18n-title="title.command"><svg class="tb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg><span data-i18n="toolbar.command">Команда</span></button>
      <button id="btn-fav" data-i18n-title="title.fav"><svg class="tb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg><span data-i18n="toolbar.fav">Папки</span></button>
      <button id="btn-fav-apps" data-i18n-title="title.favApps"><svg class="tb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span data-i18n="toolbar.favApps">Приложения</span></button>
      <button id="btn-search" data-i18n-title="title.search"><svg class="tb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span data-i18n="toolbar.search">Търсене</span></button>
      <span class="sep"></span>
      <span class="grow"></span>
      <button id="btn-settings" data-i18n-title="title.settings"><svg class="tb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg><span data-i18n="toolbar.settings">Настройки</span></button>
      <button id="btn-quit" data-i18n-title="title.quit"><svg class="tb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span data-i18n="toolbar.quit">Изход</span></button>
    </header>

    <div class="panels">
      <section class="panel" id="panel-left">
        <div class="panel-head" data-side="left"></div>
        <div class="panel-cols" data-side="left">
          <span class="col-name" data-sort="name" data-i18n="col.name">Име</span>
          <span class="col-ext" data-i18n="col.ext">Разш.</span>
          <span class="col-size" data-sort="size" data-i18n="col.size">Размер</span>
          <span class="col-date" data-sort="date" data-i18n="col.date">Дата</span>
        </div>
        <ul class="panel-list" data-side="left"></ul>
        <div class="panel-foot"></div>
      </section>
      <section class="panel" id="panel-right">
        <div class="panel-head" data-side="right"></div>
        <div class="panel-cols" data-side="right">
          <span class="col-name" data-sort="name" data-i18n="col.name">Име</span>
          <span class="col-ext" data-i18n="col.ext">Разш.</span>
          <span class="col-size" data-sort="size" data-i18n="col.size">Размер</span>
          <span class="col-date" data-sort="date" data-i18n="col.date">Дата</span>
        </div>
        <ul class="panel-list" data-side="right"></ul>
        <div class="panel-foot"></div>
      </section>
    </div>

    <footer class="toolbar bottom">
      <button class="fkey" data-fkey="F1"><svg class="fk-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span class="fnum">F1</span><span class="flabel" data-i18n="fkey.f1">Помощ</span></button>
      <button class="fkey" data-fkey="F2"><svg class="fk-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg><span class="fnum">F2</span><span class="flabel" data-i18n="fkey.f2">Сравни</span></button>
      <button class="fkey" data-fkey="F3"><svg class="fk-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span class="fnum">F3</span><span class="flabel" data-i18n="fkey.f3">Преглед</span></button>
      <button class="fkey" data-fkey="F4"><svg class="fk-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4z"/></svg><span class="fnum">F4</span><span class="flabel" data-i18n="fkey.f4">Редакция</span></button>
      <button class="fkey" data-fkey="F5"><svg class="fk-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg><span class="fnum">F5</span><span class="flabel" data-i18n="fkey.f5">Копирай</span></button>
      <button class="fkey" data-fkey="F6"><svg class="fk-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg><span class="fnum">F6</span><span class="flabel" data-i18n="fkey.f6">Премести</span></button>
      <button class="fkey" data-fkey="F7"><svg class="fk-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg><span class="fnum">F7</span><span class="flabel" data-i18n="fkey.f7">Папка</span></button>
      <button class="fkey" data-fkey="F8"><svg class="fk-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg><span class="fnum">F8</span><span class="flabel" data-i18n="fkey.f8">Изтрий</span></button>
      <button class="fkey" data-fkey="F9"><svg class="fk-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg><span class="fnum">F9</span><span class="flabel" data-i18n="fkey.f9">Меню</span></button>
      <button class="fkey" data-fkey="F10"><svg class="fk-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span class="fnum">F10</span><span class="flabel" data-i18n="fkey.f10">Изход</span></button>
      <button class="fkey" data-fkey="F11"><svg class="fk-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5z"/></svg><span class="fnum">F11</span><span class="flabel" data-i18n="fkey.f11">Преимен.</span></button>
      <button class="fkey" data-fkey="F12"><svg class="fk-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg><span class="fnum">F12</span><span class="flabel" data-i18n="fkey.f12">Инфо</span></button>
    </footer>

    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-actions" id="modal-actions"></div>
      </div>
    </div>

    <div class="statusbar" id="statusbar"></div>
    <div class="name-tooltip" id="name-tooltip"></div>
  </body>
</html>
